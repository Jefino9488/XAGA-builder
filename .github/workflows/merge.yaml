name: Merge and Upload (Smart Download + Pixeldrain)

on:
  workflow_dispatch:
    inputs:
      img_zip_url:
        description: "URL of ZIP containing .img files (Google Drive or direct link)"
        required: true
      base_zip_url:
        description: "URL of base ZIP (Google Drive or direct link)"
        required: true
      output_name:
        description: "Final ZIP name (without .zip)"
        required: true
        default: "merged_output"

jobs:
  merge:
    runs-on: ubuntu-latest

    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y wget unzip zip
          pip install --no-cache-dir gdown

      - name: Create directories
        run: |
          mkdir -p downloads work/imgs work/base

      - name: Download ZIPs (Smart handler: gdown + wget)
        shell: bash
        run: |
          set -e

          download_file() {
            url="$1"
            output="$2"
            echo "Downloading $output from $url"

            if echo "$url" | grep -q "drive.google.com"; then
              echo "Detected Google Drive link, using gdown..."
              gdown --fuzzy -O "$output" "$url"
            else
              echo "Using wget for download..."
              wget -O "$output" "$url"
            fi
          }

          download_file "${{ github.event.inputs.img_zip_url }}"  downloads/imgs.zip
          download_file "${{ github.event.inputs.base_zip_url }}" downloads/base.zip

      - name: Verify ZIP files (fail fast)
        run: |
          ls -lh downloads
          unzip -t downloads/imgs.zip
          unzip -t downloads/base.zip

      - name: Extract ZIPs
        run: |
          unzip downloads/imgs.zip -d work/imgs
          unzip downloads/base.zip -d work/base

      - name: Replace /images folder with .img files
        run: |
          mkdir -p work/base/images
          cp -vf work/imgs/*.img work/base/images/

      - name: Repack merged ZIP
        run: |
          cd work/base
          zip -r "../../${{ github.event.inputs.output_name }}.zip" .

      - name: Upload to Pixeldrain
        run: |
          curl -T "${{ github.event.inputs.output_name }}.zip" \
            -u :${{ secrets.PIXELDRAIN_API_KEY }} \
            https://pixeldrain.com/api/file/
